services:
  - type: web
    name: varanasi-yatra-backend
    env: node
    plan: standard
    buildCommand: cd backend && npm install --production
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: NOTIFICATION_PROVIDER
        value: ProductionProvider
      - key: LOG_LEVEL
        value: info
